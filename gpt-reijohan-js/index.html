<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReijohanGPT</title>

  <!-- CSS GLOBAL -->

  <link rel="stylesheet" href="./src/global.css">

  <!-- =========================================
       JAVASCRIPT
       ÚNICO PUNTO DE ENTRADA
  ========================================== -->

  <script type="module" src="./src/index.js"></script>

</head>


<body>

  <!-- =========================================
       APLICACIÓN PRINCIPAL
  ========================================== -->

  <div class="chat-app">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <chat-sidebar>

      <chat-logo></chat-logo>

      <chat-sidebar-header></chat-sidebar-header>

      <chat-sidebar-content>

        <chat-new-button></chat-new-button>

        <chat-history></chat-history>

        <chat-theme></chat-theme>

        <chat-user></chat-user>

      </chat-sidebar-content>

    </chat-sidebar>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="chat-main">


      <!-- =======================================
           CABECERA
      ======================================== -->

      <chat-header></chat-header>


      <!-- =======================================
           CONVERSACIÓN
      ======================================== -->

      <chat-conversation>

        <chat-welcome slot="welcome"></chat-welcome>

        <chat-status slot="status"></chat-status>

        <chat-messages slot="messages"></chat-messages>

      </chat-conversation>


      <!-- =======================================
           ZONA DE ESCRITURA
      ======================================== -->

      <chat-input>

        <chat-file-preview slot="file-preview"></chat-file-preview>

      </chat-input>


    </main>

  </div>

</body>

</html>
